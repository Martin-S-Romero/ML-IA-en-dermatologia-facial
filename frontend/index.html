<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="SkinAI — Detección de acné y rosácea con inteligencia artificial" />
  <title>SkinAI</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,500;0,700;1,300;1,500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <!-- Chart.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>

  <!-- Styles -->
  <link rel="stylesheet" href="/src/styles/style.css" />

  <!-- Define go() stub immediately — prevents "go is not defined" on any inline handler -->
  <script>
    window._goQueue  = [];
    window._goReady  = false;
    window.go = function(id) {
      window._goReady ? window._goFull(id) : window._goQueue.push(id);
    };
  </script>
</head>
<body class="font-body bg-bg text-ink antialiased">

  <!-- Top navigation bar -->
  <div id="slot-navbar"></div>

  <!-- Page container — pages are injected here -->
  <main id="app" role="main"></main>

  <!-- Modals (always in DOM, hidden by default) -->
  <div id="slot-modals"></div>

  <!-- Main controller -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>

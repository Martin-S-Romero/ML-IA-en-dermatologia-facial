<section
  id="page-auth"
  class="page-enter min-h-[calc(100vh-44px)] bg-bg flex items-center justify-center"
  aria-label="Registro e inicio de sesión"
>
  <div class="w-full max-w-md mx-auto px-4 py-8 lg:py-12">

    <button class="btn-back-dark mb-4 text-sm" data-go="landing">← Volver</button>

    <!-- Vista: Registro -->
    <div id="auth-register">
      <div class="card">
        <div class="card-body lg:p-7">
          <header class="flex items-center gap-2 mb-5">
            <span class="font-display text-xl text-forest">Skin<span class="text-rose">AI</span></span>
          </header>

          <h1 class="font-display text-xl text-ink mb-1">Crea tu cuenta</h1>
          <p class="text-xs text-slate mb-5">Datos para personalizar tu análisis</p>

          <form id="form-register" onsubmit="return false">
            <div id="register-error" class="hidden mb-3 bg-red-50 border border-red-200 text-red-700 text-xs rounded-md px-3 py-2"></div>

            <div class="mb-3">
              <label class="field-label" for="reg-name">Nombre completo</label>
              <input id="reg-name" type="text" class="field-input" placeholder="María García" autocomplete="name" required />
            </div>
            <div class="mb-3">
              <label class="field-label" for="reg-email">Correo electrónico</label>
              <input id="reg-email" type="email" class="field-input" placeholder="maria@email.com" autocomplete="email" required />
            </div>
            <div class="mb-3">
              <label class="field-label" for="reg-pw">Contraseña</label>
              <input id="reg-pw" type="password" class="field-input" placeholder="••••••••" autocomplete="new-password" required minlength="8" />
            </div>
            <div class="mb-4">
              <label class="field-label" for="reg-pw2">Confirmar contraseña</label>
              <input id="reg-pw2" type="password" class="field-input" placeholder="••••••••" autocomplete="new-password" required />
            </div>

            <div class="info-box mb-3 text-[11px]">
               Tus datos e imágenes se usan solo para tu diagnóstico.
            </div>

            <label class="flex items-start gap-2 mb-4 cursor-pointer">
              <input id="reg-consent" type="checkbox" class="w-3.5 h-3.5 accent-forest flex-shrink-0 mt-0.5" required />
              <span class="text-[11px] text-slate leading-snug">
                Acepto los <button type="button" class="underline bg-transparent border-none cursor-pointer text-slate" onclick="showTerms()">términos de uso</button> y el <u>tratamiento de mis datos</u>
              </span>
            </label>

            <button type="submit" id="btn-register" class="btn-primary">Crear cuenta →</button>
            <div class="text-center mt-3">
              <button type="button" class="btn-ghost" onclick="showAuthView('login')">Ya tengo cuenta — iniciar sesión</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Vista: Login -->
    <div id="auth-login" class="hidden">
      <div class="card">
        <div class="card-body lg:p-7">
          <header class="flex items-center gap-2 mb-5">
            <span class="font-display text-xl text-forest">Skin<span class="text-rose">AI</span></span>
          </header>

          <h1 class="font-display text-xl text-ink mb-1">Bienvenido de nuevo</h1>
          <p class="text-xs text-slate mb-5">Inicia sesión para ver tu historial</p>

          <form id="form-login" onsubmit="return false">
            <div id="login-error" class="hidden mb-3 bg-red-50 border border-red-200 text-red-700 text-xs rounded-md px-3 py-2"></div>

            <div class="mb-3">
              <label class="field-label" for="login-email">Correo electrónico</label>
              <input id="login-email" type="email" class="field-input" placeholder="maria@email.com" autocomplete="email" required />
            </div>
            <div class="mb-2">
              <label class="field-label" for="login-pw">Contraseña</label>
              <input id="login-pw" type="password" class="field-input" placeholder="••••••••" autocomplete="current-password" required />
            </div>
            <div class="text-right mb-4">
              <button type="button" id="btn-forgot" class="btn-ghost">¿Olvidaste tu contraseña?</button>
            </div>

            <button type="submit" id="btn-login" class="btn-primary">Iniciar sesión →</button>
            <div class="text-center mt-3">
              <button type="button" class="btn-ghost" onclick="showAuthView('register')">Crear cuenta nueva</button>
            </div>
          </form>
        </div>
      </div>
    </div>

  </div>
</section>

<section
  id="page-reset-password"
  class="page-enter min-h-[calc(100vh-44px)] bg-bg flex items-center justify-center"
  aria-label="Restablecer contraseña"
>
  <div class="w-full max-w-md mx-auto px-4 py-8 lg:py-12">

    <div class="card">
      <div class="card-body lg:p-7">
        <header class="flex items-center gap-2 mb-5">
          <span class="font-display text-xl text-forest">Cutis<span class="text-rose">Lab</span></span>
        </header>

        <h1 class="font-display text-xl text-ink mb-1">Nueva contraseña</h1>
        <p class="text-xs text-slate mb-5">Elige una contraseña segura de al menos 8 caracteres.</p>

        <div id="reset-error"   class="hidden mb-3 bg-red-50 border border-red-200 text-red-700 text-xs rounded-md px-3 py-2"></div>
        <div id="reset-success" class="hidden mb-3 bg-green-50 border border-green-200 text-green-700 text-xs rounded-md px-3 py-2"></div>

        <form id="form-reset-password" onsubmit="return false">
          <div class="mb-3">
            <label class="field-label" for="reset-pw">Nueva contraseña</label>
            <div class="relative">
              <input id="reset-pw" type="password" class="field-input pr-10"
                placeholder="••••••••" autocomplete="new-password" required minlength="8" />
              <button type="button" tabindex="-1" aria-label="Mostrar contraseña"
                class="absolute inset-y-0 right-0 flex items-center px-3 text-slate hover:text-ink transition-colors"
                onclick="togglePw('reset-pw', this)">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="17" height="17">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                </svg>
              </button>
            </div>
          </div>

          <div class="mb-5">
            <label class="field-label" for="reset-pw2">Confirmar contraseña</label>
            <div class="relative">
              <input id="reset-pw2" type="password" class="field-input pr-10"
                placeholder="••••••••" autocomplete="new-password" required minlength="8" />
              <button type="button" tabindex="-1" aria-label="Mostrar contraseña"
                class="absolute inset-y-0 right-0 flex items-center px-3 text-slate hover:text-ink transition-colors"
                onclick="togglePw('reset-pw2', this)">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="17" height="17">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                </svg>
              </button>
            </div>
          </div>

          <button id="btn-reset-submit" type="submit" class="btn-primary w-full">
            Guardar contraseña
          </button>
        </form>

        <button class="w-full text-center text-xs text-slate mt-4 hover:text-ink transition-colors"
          data-go="auth">
          Volver al inicio de sesión
        </button>
      </div>
    </div>

  </div>
</section>

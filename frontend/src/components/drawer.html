<!-- Overlay — invisible, closes drawer on outside click -->
<div id="drawer-overlay" class="drawer-overlay" aria-hidden="true" onclick="closeDrawer()"></div>

<!-- Side drawer -->
<aside id="side-drawer" class="side-drawer" role="complementary" aria-label="Menú lateral">

  <!-- Header row: mirrors the desktop sidebar header so ☰ + CutisLab are always visible -->
  <div class="flex items-center gap-3 px-4 h-14 border-b border-white/10 flex-shrink-0">
    <button
      class="ham-btn flex flex-col gap-[5px] p-1.5 bg-transparent border-none cursor-pointer flex-shrink-0"
      onclick="closeDrawer()"
      aria-label="Cerrar menú"
      aria-expanded="true"
    >
      <span class="block w-5 h-0.5 bg-white/80 rounded transition-all duration-300"></span>
      <span class="block w-5 h-0.5 bg-white/80 rounded transition-all duration-300"></span>
      <span class="block w-5 h-0.5 bg-white/80 rounded transition-all duration-300"></span>
    </button>
    <span class="font-display text-lg text-bark tracking-tight">CutisLab</span>
  </div>

  <nav class="flex-1 p-3.5 pt-4" aria-label="Menú de usuario">
    <button class="sidebar-nav-item w-full text-left" onclick="closeDrawer(); dtab('dd')" data-go="dashboard">Dashboard</button>
    <div class="h-px bg-white/10 my-2.5"></div>
    <button class="sidebar-nav-item w-full text-left" data-go="account" onclick="closeDrawer()">Mi cuenta</button>
    <button class="sidebar-nav-item w-full text-left" onclick="closeDrawer(); openPdfModal()">Exportar PDF</button>
    <div class="h-px bg-white/10 my-2.5"></div>
    <button class="sidebar-nav-item w-full text-left" onclick="closeDrawer(); showTerms()">Términos</button>
    <button class="sidebar-nav-item w-full text-left !text-rose/80 hover:!text-rose" onclick="logout()">Cerrar sesión</button>
  </nav>
  <footer class="px-4 py-3 border-t border-white/10">
    <button class="text-[10px] text-white/40 hover:text-white/60 underline" onclick="showTerms()">CutisLab v1.0 · Privacidad</button>
  </footer>
</aside>
